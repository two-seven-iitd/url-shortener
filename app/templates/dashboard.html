{% extends "base.html" %}
{% block title %}My URLs{% endblock %}

{% block content %}
<div class="analytics-header">
    <h1>My URLs</h1>
</div>

<div class="api-key-bar">
    <label>API Key</label>
    <input type="text" class="form-input" id="apiKey" placeholder="sk_live_..." autocomplete="off">
    <button class="btn btn-primary btn-sm" onclick="loadUrls()">Load</button>
</div>

<div id="urlsContent">
    <div class="empty-state">
        <h3>Enter your API key to see your URLs</h3>
        <p>Your shortened URLs and click stats will appear here.</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const BASE = window.location.origin;

async function loadUrls() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) { showToast('Please enter your API key', 'error'); return; }
    localStorage.setItem('api_key', apiKey);

    const container = document.getElementById('urlsContent');
    container.innerHTML = '<div class="empty-state"><div class="spinner" style="width:24px;height:24px;border-width:3px;border-color:rgba(108,92,231,0.3);border-top-color:var(--accent)"></div></div>';

    try {
        const res = await fetch(`${BASE}/urls?limit=50`, { headers: { 'X-API-Key': apiKey } });
        if (!res.ok) { const d = await res.json(); throw new Error(d.detail || 'Failed to load'); }
        const data = await res.json();

        if (data.urls.length === 0) {
            container.innerHTML = '<div class="empty-state"><h3>No URLs yet</h3><p>Go to <a href="/" style="color:var(--accent)">Shorten</a> to create your first link.</p></div>';
            return;
        }

        let html = `<div class="card fade-in"><div class="table-wrap"><table>
            <thead><tr>
                <th>Short Code</th>
                <th>Original URL</th>
                <th>Clicks</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
            </tr></thead><tbody>`;

        for (const u of data.urls) {
            const status = !u.is_active ? 'inactive' :
                (u.expires_at && new Date(u.expires_at) < new Date()) ? 'expired' : 'active';
            const badgeClass = status === 'active' ? 'badge-active' : status === 'expired' ? 'badge-expired' : 'badge-inactive';
            const shortUrl = `${BASE}/${u.code}`;
            const created = new Date(u.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

            html += `<tr id="row-${u.code}">
                <td>
                    <a href="${shortUrl}" target="_blank" class="code-link">${u.code}</a>
                    ${u.is_custom_alias ? '<span class="badge badge-custom">custom</span>' : ''}
                </td>
                <td class="url-cell" title="${u.original_url}">${u.original_url}</td>
                <td class="clicks-count">${u.clicks_count.toLocaleString()}</td>
                <td><span class="badge ${badgeClass}">${status}</span></td>
                <td style="color:var(--text-muted);font-size:0.82rem">${created}</td>
                <td>
                    <div class="table-actions">
                        <a href="/dashboard/${u.code}" class="btn btn-ghost btn-sm">Analytics</a>
                        <button class="btn btn-sm btn-ghost" onclick="copyUrl('${shortUrl}', this)">Copy</button>
                        ${u.is_active ? `<button class="btn btn-sm btn-danger" onclick="deleteUrl('${u.code}')">Delete</button>` : ''}
                    </div>
                </td>
            </tr>`;
        }

        html += '</tbody></table></div></div>';
        html += `<p style="color:var(--text-muted);font-size:0.8rem;margin-top:12px;text-align:right">${data.total} total URL${data.total !== 1 ? 's' : ''}</p>`;
        container.innerHTML = html;
    } catch (err) {
        showToast(err.message, 'error');
        container.innerHTML = '<div class="empty-state"><h3>Failed to load URLs</h3><p>Check your API key and try again.</p></div>';
    }
}

function copyUrl(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
    });
}

async function deleteUrl(code) {
    if (!confirm(`Deactivate /${code}? This cannot be undone.`)) return;
    const apiKey = document.getElementById('apiKey').value.trim();
    try {
        const res = await fetch(`${BASE}/urls/${code}`, { method: 'DELETE', headers: { 'X-API-Key': apiKey } });
        if (!res.ok) { const d = await res.json(); throw new Error(d.detail || 'Delete failed'); }
        showToast(`/${code} deactivated`, 'success');
        loadUrls();
    } catch (err) {
        showToast(err.message, 'error');
    }
}

function showToast(msg, type) {
    let container = document.querySelector('.toast-container');
    if (!container) { container = document.createElement('div'); container.className = 'toast-container'; document.body.appendChild(container); }
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('api_key');
    if (saved) { document.getElementById('apiKey').value = saved; loadUrls(); }
});
</script>
{% endblock %}
