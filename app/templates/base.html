<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}URL Shortener{% endblock %} | xoragain</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">&#x26A1;</span>
                <span>xoragain</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link {% if active == 'home' %}active{% endif %}">Shorten</a>
                <a href="/dashboard" class="nav-link {% if active == 'dashboard' %}active{% endif %}">My URLs</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>Built with FastAPI, Redis & PostgreSQL</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
